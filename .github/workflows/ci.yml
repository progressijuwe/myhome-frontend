name: CI / CD

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Format, lint and types
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              # `npm ci` installs exactly the lockfile, and fails if package.json and
              # the lockfile disagree — which is the check we want on CI.
              run: npm ci

            # Each check runs even when an earlier one fails, so a single push
            # reports every problem instead of one per round trip.
            - name: Check formatting
              run: npm run format:check

            - name: Lint
              if: '!cancelled()'
              run: npm run lint

            - name: Typecheck
              if: '!cancelled()'
              run: npm run typecheck

    build:
        name: Build (Node ${{ matrix.node }})
        runs-on: ubuntu-latest

        env:
            # The build inlines NEXT_PUBLIC_* values, so they must be present and
            # stable for the compile to be meaningful. Placeholders: this job only
            # proves the app compiles, it never talks to a real API. Deliberately
            # scoped to this job — the deploy jobs take their values from the
            # Vercel project instead, and must not inherit these.
            NEXT_PUBLIC_APP_URL: http://localhost:3000
            NEXT_PUBLIC_API_URL: http://localhost:8000/api

        strategy:
            fail-fast: false
            matrix:
                # Next 16 itself runs on 20.9+, but this project's floor is
                # higher and set by its own toolchain: lint-staged 17 requires
                # 22.22.1, and the lockfile is written by npm 11, which ships
                # with Node 22+. Node 20's npm 10.8 cannot install it — it
                # rejects the optional wasm32 entries as out of sync.
                node: ['22', '24']

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Next shares a cache between builds in .next/cache; without it every run
            # starts cold and warns "No Cache Detected".
            - name: Restore Next.js build cache
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                      ${{ github.workspace }}/.next/cache
                  key: ${{ runner.os }}-node${{ matrix.node }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
                  restore-keys: |
                      ${{ runner.os }}-node${{ matrix.node }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

            - name: Build
              run: npm run build

    security:
        name: Dependency audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Only high and critical fail the build. The npm advisory database
            # reports transitive low-severity issues constantly, and a job that is
            # always red is a job nobody reads.
            - name: Audit for known vulnerabilities
              run: npm audit --audit-level=high

    # ---- CD -------------------------------------------------------------
    # The deploy jobs need the full check suite to pass first: `needs` is what
    # makes that a guarantee rather than a race, which is why deployment lives
    # in this workflow rather than one of its own.

    deploy-config:
        name: Check deploy configuration
        runs-on: ubuntu-latest
        outputs:
            configured: ${{ steps.check.outputs.configured }}
        steps:
            # `secrets` cannot be read from a job-level `if`, so the answer is
            # computed here and passed down as an output. Without this the
            # deploy jobs fail on an empty --token, which reads as a broken
            # pipeline rather than one that was simply never configured.
            - name: Check for Vercel secrets
              id: check
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  missing=""
                  [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
                  [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
                  [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"

                  # Logged to stdout as well as the summary: a job that only
                  # reports on failure leaves you unable to tell "not
                  # configured" from "wrong event" by reading the run.
                  if [ -z "$missing" ]; then
                      echo "All three Vercel secrets present -> configured=true"
                      echo "configured=true" >> "$GITHUB_OUTPUT"
                      {
                          echo "### Deployment configured"
                          echo ""
                          echo "All three Vercel secrets are present."
                          echo ""
                          echo "If a deploy job still shows as skipped, it is the event:"
                          echo "previews run only on a pull request, production only on a"
                          echo "push to \`main\`. A skipped job with every check green and"
                          echo "this message showing is working as intended."
                      } >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi

                  echo "Missing secrets:$missing -> configured=false"
                  echo "configured=false" >> "$GITHUB_OUTPUT"
                  {
                      echo "### Deployment skipped"
                      echo ""
                      echo "Missing repository secrets:$missing"
                      echo ""
                      echo "They must be **repository** secrets on the **Secrets** tab:"
                      echo "Settings → Secrets and variables → Actions. Environment"
                      echo "secrets are invisible to this job, and Variables are a"
                      echo "different context entirely."
                  } >> "$GITHUB_STEP_SUMMARY"

    # A skipped deploy job below is normal: previews run only on a pull
    # request, production only on a push to main. Merging feature -> develop
    # matches neither, and that is intended rather than a misconfiguration.

    deploy-preview:
        name: Deploy preview
        runs-on: ubuntu-latest
        needs: [quality, build, security, deploy-config]
        # A pull request from a fork has no access to secrets, so the deploy
        # would fail on something the contributor cannot fix.
        if: >-
            needs.deploy-config.outputs.configured == 'true' &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
        environment:
            name: preview
            url: ${{ steps.deploy.outputs.url }}
        env:
            # The CLI reads the project it should act on from these two. Passing
            # only --token leaves it with no linked project and it fails.
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install Vercel CLI
              run: npm install --global vercel@latest

            # `vercel pull` fetches the project's own environment variables, so
            # NEXT_PUBLIC_* come from Vercel rather than from this file.
            - name: Pull Vercel environment
              run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

            - name: Build
              run: vercel build --token="$VERCEL_TOKEN"

            - name: Deploy
              id: deploy
              run: |
                  url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
                  echo "url=$url" >> "$GITHUB_OUTPUT"

            - name: Summarise
              # A block scalar: the "Preview: " prefix would otherwise parse
              # as a nested YAML mapping rather than shell.
              run: |
                  echo "Preview: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

    deploy-production:
        name: Deploy production
        runs-on: ubuntu-latest
        needs: [quality, build, security, deploy-config]
        if: >-
            needs.deploy-config.outputs.configured == 'true' &&
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main'
        environment:
            name: production
            url: ${{ steps.deploy.outputs.url }}
        env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install Vercel CLI
              run: npm install --global vercel@latest

            - name: Pull Vercel environment
              run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

            - name: Build
              run: vercel build --prod --token="$VERCEL_TOKEN"

            - name: Deploy
              id: deploy
              run: |
                  url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
                  echo "url=$url" >> "$GITHUB_OUTPUT"

            - name: Summarise
              # A block scalar: the "Production: " prefix would otherwise parse
              # as a nested YAML mapping rather than shell.
              run: |
                  echo "Production: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
